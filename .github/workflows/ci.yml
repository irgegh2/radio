name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      ADMIN_PASSWORD: ci-password
      ADMIN_SESSION_SECRET: ci-secret-ci-secret-ci-secret
      BROADCAST_API_KEY: ci-broadcast-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma db push
      - run: npm run db:seed
      - run: npm run build
